<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Accounting RAG — Hubungkan ke Server</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #050A18; color: #F1F5F9;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 1.5rem; padding: 3rem 2.5rem;
      max-width: 440px; width: 100%; text-align: center;
      backdrop-filter: blur(16px);
    }
    .logo {
      width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #1D4ED8, #3B82F6);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(59,130,246,0.4);
    }
    .logo svg { width: 28px; height: 28px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #94A3B8; line-height: 1.6; margin-bottom: 1.5rem; }
    label { display: block; text-align: left; font-size: 0.8rem; font-weight: 600; color: #94A3B8; margin-bottom: 0.4rem; }
    input {
      width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem;
      border: 1px solid rgba(148,163,184,0.2); background: rgba(0,0,0,0.3);
      color: #F1F5F9; font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #3B82F6; }
    input::placeholder { color: #475569; }
    .hint { font-size: 0.75rem; color: #64748B; margin-top: 0.5rem; text-align: left; }
    button {
      width: 100%; margin-top: 1.5rem; padding: 0.8rem; border: none; border-radius: 0.75rem;
      background: linear-gradient(135deg, #1D4ED8, #2563EB); color: white;
      font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,130,246,0.4); }
    button:active { transform: translateY(0); }
    .error { color: #EF4444; font-size: 0.8rem; margin-top: 0.75rem; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M3 21V7a2 2 0 0 1 2-2h6l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 17V11"/><path d="M15 17V13"/></svg>
    </div>
    <h1>AI Accounting RAG</h1>
    <p>Masukkan URL server untuk menghubungkan aplikasi ini ke data dan layanan Anda.</p>

    <label for="server-url">URL Server</label>
    <input type="url" id="server-url" placeholder="https://xxxx.ngrok.io" autofocus />
    <div class="hint">Contoh: jika menggunakan ngrok, masukkan URL seperti <code style="color:#60A5FA">https://abc123.ngrok.io</code></div>

    <div class="error" id="error-msg"></div>
    <button id="connect-btn" onclick="connect()">Hubungkan</button>
  </div>

  <script>
    const input = document.getElementById('server-url')
    const errorMsg = document.getElementById('error-msg')
    const btn = document.getElementById('connect-btn')

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connect()
    })

    async function connect() {
      let url = input.value.trim()
      if (!url) {
        showError('Masukkan URL server terlebih dahulu.')
        return
      }
      // Auto-append http:// if missing
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url
      }
      // Basic validation
      try { new URL(url) } catch {
        showError('URL tidak valid. Periksa kembali.')
        return
      }
      // Strip trailing slash
      url = url.replace(/\/+$/, '')

      btn.textContent = 'Menghubungkan...'
      btn.disabled = true
      errorMsg.style.display = 'none'

      try {
        // Save to config
        if (window.electronAPI && window.electronAPI.setRemoteUrl) {
          await window.electronAPI.setRemoteUrl(url)
        }
      } catch (e) {
        console.warn('Gagal menyimpan config:', e)
      }

      // Navigate to the server
      window.location.href = url
    }

    function showError(msg) {
      errorMsg.textContent = msg
      errorMsg.style.display = 'block'
    }
  </script>
</body>
</html>
