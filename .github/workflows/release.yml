name: Build Desktop Installers

# Menghasilkan installer desktop untuk macOS (DMG), Windows (EXE), dan Linux (AppImage).
# Jalankan manual (Actions → Build Desktop Installers → Run workflow) atau otomatis
# saat push tag versi (v1.0.0, dst.) — installer otomatis di-publish ke GitHub Release.
#
# Prasyarat: set secret repo OLLAMA_API_KEY di GitHub (Settings → Secrets and
# variables → Actions). Tanpa secret, key tidak ter-bundle ke installer.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform yang dibangun (windows | linux | macos | windows,linux | all)'
        required: true
        default: 'windows,linux'
        type: choice
        options:
          - 'windows,linux'
          - windows
          - linux
          - macos
          - all
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (DMG)
            target: macos
          - os: windows-latest
            name: Windows (EXE)
            target: windows
          - os: ubuntu-latest
            name: Linux (AppImage)
            target: linux

    steps:
      - name: Should build?
        id: should
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.target }}"
          ME="${{ matrix.target }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "all" ] || [ "$TARGET" = "$ME" ]; then
            echo "should=true" >> $GITHUB_OUTPUT
          elif [ "$TARGET" = "windows,linux" ] && { [ "$ME" = "windows" ] || [ "$ME" = "linux" ]; }; then
            echo "should=true" >> $GITHUB_OUTPUT
          else
            echo "should=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.should.outputs.should == 'true'
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        if: steps.should.outputs.should == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node 20
        if: steps.should.outputs.should == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend venv + dependencies
        if: steps.should.outputs.should == 'true'
        shell: bash
        run: |
          cd backend
          python -m venv venv
          if [ -f venv/Scripts/python.exe ]; then VENV_PY=venv/Scripts/python.exe; else VENV_PY=venv/bin/python; fi
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install -r requirements.txt

      - name: Frontend dependencies
        if: steps.should.outputs.should == 'true'
        shell: bash
        run: npm install
        working-directory: frontend

      - name: Electron dependencies
        if: steps.should.outputs.should == 'true'
        shell: bash
        run: npm install
        working-directory: electron

      - name: Build installer (npm run build)
        if: steps.should.outputs.should == 'true'
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build
        working-directory: electron

      - name: Upload installer (artifact)
        if: steps.should.outputs.should == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            electron/release/*.dmg
            electron/release/*.exe
            electron/release/*.AppImage

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.should.outputs.should == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/release/*.dmg
            electron/release/*.exe
            electron/release/*.AppImage
